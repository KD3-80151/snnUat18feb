<template>
    <template if:true={showSpinner}>
        <div style="height: 500px;">
            <c-custom-spinner></c-custom-spinner>
        </div>
    </template>

    <template if:false={showSpinner}>
        <iframe if:true={subDocUrl} src={subDocUrl} width="100%" height="800px"></iframe>

        <div style="text-align: center; margin-top: 20px;">
            <lightning-button
                label="Cancel"
                variant="brand"
                onclick={handleCancel}
                class="slds-m-left_x-small">
            </lightning-button>

            <lightning-button
                label="Send to Customer"
                variant="brand"
                onclick={sendEmailtoCustomerwithAttachment}
                class="slds-m-left_x-small">
            </lightning-button>
        </div>
    </template>
</template>
