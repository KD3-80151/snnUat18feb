<template>
    <lightning-card title="Update Receipt's Opportunity">
        <div class="slds-m-around_medium">
            
            <template if:true={isSaving}>
                <lightning-spinner alternative-text="Saving..."></lightning-spinner>
            </template>

            
            <template if:false={isSaving}>
                <!-- Client (21 Nov): only active (not Closed Lost) opportunities can be chosen -->
                <lightning-record-picker
                    label="Opportunity"
                    placeholder="Search active opportunities..."
                    object-api-name="Opportunity"
                    filter={activeOpportunityFilter}
                    onchange={handleLookupChange}
                    required
                ></lightning-record-picker>

                <lightning-button
                    class="slds-m-top_medium"
                    label="Save"
                    variant="brand"
                    onclick={handleSave}
                ></lightning-button>
            </template>
        </div>
    </lightning-card>
</template>
