<template>
    <lightning-card>
        <div class="slds-p-horizontal_medium slds-p-vertical_medium">
            <h2 style="padding: 12px;background-color: #906a09; color:white; border-radius:5px;" class="slds-text-heading_medium slds-text-align_center">Customer Follow Up</h2>

            <lightning-combobox
                class="slds-m-top_medium"
                label="Customer Response"
                value={customerResponse}
                options={responseOptions}
                placeholder="Select..."
                onchange={handleResponseChange}
                required>
            </lightning-combobox>

            <template if:true={isInterested}>
                <lightning-input class="slds-m-top_small" label="Title" value={title} onchange={handleTitleChange} required></lightning-input>
                <lightning-textarea class="slds-m-top_small" label="Remarks" value={remarks} onchange={handleRemarksChange} required></lightning-textarea>
            </template>

            <template if:true={isNotInterested}>
                <lightning-combobox
                    class="slds-m-top_small"
                    label="Opportunity Lost Reason"
                    value={lossReason}
                    options={lossReasonOptions}
                    placeholder="Select..."
                    onchange={handleLossReasonChange}
                    required>
                </lightning-combobox>
                <lightning-textarea class="slds-m-top_small" label="Remarks" value={remarks} onchange={handleRemarksChange} required></lightning-textarea>
            </template>

            <div class="slds-m-top_medium slds-text-align_center">
                <lightning-button variant="brand" label="Save" onclick={handleSave} disabled={isSaveDisabled}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
